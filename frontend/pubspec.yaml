name: baxall_construction_app
description: "Baxall Construction — Site Assistant. A construction site assistant app for engineers and site managers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  dio: ^5.7.0

  provider: ^6.1.2

  shared_preferences: ^2.3.2

  go_router: ^14.6.2

  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  speech_to_text: ^7.0.0
  record: ^6.2.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
